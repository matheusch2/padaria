<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5c2e18" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="imagens/logo.png" />
    <link rel="apple-touch-icon" href="imagens/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Padaria Gestão" />
    <style>html{visibility:hidden}</style>
    <title>Entrar - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login.css?v=20260925-1502" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <div class="login-hero">
        <div class="login-marca">
          <img src="imagens/logo.png" alt="Padaria Gestão" />
          <h1 id="tituloLogin">Entrar</h1>
          <p class="login-subtitulo">Bem-vindo!</p>
        </div>

        <section class="login-card" aria-labelledby="tituloLogin">
          <div class="login-form">
            <div class="login-campo">
              <label for="emailLogin">E-mail</label>
              <div class="login-input-wrap">
                <svg class="login-input-icone" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m3 7 9 6 9-6" />
                </svg>
                <input id="emailLogin" type="email" autocomplete="email" placeholder="Digite seu e-mail" />
              </div>
            </div>

            <div class="login-campo">
              <label for="senhaLogin">Senha</label>
              <div class="login-input-wrap">
                <svg class="login-input-icone" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input id="senhaLogin" type="password" autocomplete="current-password" placeholder="Digite sua senha" minlength="6" />
                <button id="btnAlternarSenha" class="login-senha-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                  <svg class="icone-olho-aberto" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                  <svg class="icone-olho-fechado" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 3 18 18" />
                    <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-2.2 2.9" />
                    <path d="M6.7 6.7C3.6 8.4 2 12 2 12s3.5 6 10 6a10.9 10.9 0 0 0 5.3-1.3" />
                    <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
                  </svg>
                </button>
              </div>
            </div>

            <p id="avisoLogin" class="login-aviso" hidden></p>

            <button id="btnEntrar" class="login-primario" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
              </svg>
              Entrar
            </button>

            <a id="linkEsqueciSenha" class="login-link-secundario" href="recuperar-senha.html">Esqueci minha senha</a>

            <div class="login-ou" aria-hidden="true"><span></span><b>Não tem uma conta?</b><span></span></div>
            <a id="btnCriarConta" class="login-secundario" href="cadastro.html">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="19" y1="8" x2="19" y2="14" />
                <line x1="16" y1="11" x2="22" y2="11" />
              </svg>
              Criar conta
            </a>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="js/login.js?v=20260925-1502"></script>
  </body>
</html>
