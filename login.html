<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5c2e18" />
    <title>Entrar - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login.css?v=20260925-1502" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="tituloLogin">
        <div class="login-marca">
          <img src="imagens/logo.png" alt="Padaria Gestão" />
          <h1 id="tituloLogin">Padaria Gestão</h1>
        </div>

        <div class="login-form">
          <div class="login-campo">
            <label for="emailLogin">E-mail</label>
            <div class="login-input-wrap">
              <svg class="login-input-icone" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m3 7 9 6 9-6" />
              </svg>
              <input id="emailLogin" type="email" autocomplete="email" placeholder="Seu e-mail" />
            </div>
          </div>

          <div class="login-campo">
            <label for="senhaLogin">Senha</label>
            <div class="login-input-wrap">
              <svg class="login-input-icone" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
              <input id="senhaLogin" type="password" autocomplete="current-password" placeholder="Sua senha" minlength="6" />
              <button id="btnAlternarSenha" class="login-senha-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                <svg class="icone-olho-aberto" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="2.5" />
                </svg>
                <svg class="icone-olho-fechado" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m3 3 18 18" />
                  <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-2.2 2.9" />
                  <path d="M6.7 6.7C3.6 8.4 2 12 2 12s3.5 6 10 6a10.9 10.9 0 0 0 5.3-1.3" />
                  <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
                </svg>
              </button>
            </div>
          </div>

          <p id="avisoLogin" class="login-aviso" hidden></p>

          <button id="btnEntrar" class="login-primario" type="button">Entrar</button>
          <div class="login-ou" aria-hidden="true"><span></span><b>ou</b><span></span></div>
          <button id="btnCriarConta" class="login-secundario" type="button">Criar conta</button>
        </div>
      </section>
    </main>

    <script type="module" src="js/login.js?v=20260925-1502"></script>
  </body>
</html>
