<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8c4527" />
    <title>Relatório - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="relatorio-gerado.css?v=20260925-4" />
  </head>
  <body class="relatorio-gerado-body">
    <div class="relatorio-acoes no-print">
      <a href="relatorios-impressao.html" class="relatorio-acao secundario">Voltar</a>
      <button id="btnImprimir" class="relatorio-acao primario" type="button">Imprimir / Salvar PDF</button>
    </div>

    <form id="filtroVendas" class="filtro-vendas no-print" hidden>
      <label>Relatório
        <select id="modoVendas">
          <option value="diario">Diário</option>
          <option value="semanal">Semanal (segunda a domingo)</option>
          <option value="mensal">Mensal</option>
          <option value="personalizado">Personalizado</option>
        </select>
      </label>
      <label><span id="rotuloDataVendas">Dia</span><input id="dataVendas" type="date" required /></label>
      <label id="campoFimVendas" hidden>Data final<input id="fimVendas" type="date" /></label>
      <button type="submit" class="relatorio-acao primario">Atualizar relatório</button>
      <label class="opcao-detalhes"><input id="imprimirDetalhesVendas" type="checkbox" /> Incluir todas as vendas detalhadas na impressão / PDF</label>
      <p id="erroFiltroVendas" class="erro-filtro" role="alert" hidden></p>
    </form>

    <main id="folhaRelatorio" class="folha-relatorio" aria-live="polite">
      <header class="documento-cabecalho">
        <h1 id="tituloRelatorio">Relatório</h1>
        <div class="documento-informacoes">
          <p id="periodoRelatorio" class="documento-periodo">Carregando período...</p>
          <p class="documento-meta">
            <span>Gerado em:</span>
            <b id="geradoEm">—</b>
          </p>
        </div>
      </header>

      <div id="estadoRelatorio" class="estado-relatorio">Carregando dados...</div>
      <section id="conteudoRelatorio" hidden></section>
    </main>

    <script type="module" src="js/relatorio-gerado.js?v=20260925-3"></script>
  </body>
</html>
