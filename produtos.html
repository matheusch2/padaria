<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#8c4527" />
    <title>Produtos cadastrados - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pagina.css" />
    <link rel="stylesheet" href="ver-produtos.css" />
  </head>

  <body class="pagina-app">
    <header class="topo-pagina">
      <a class="voltar" href="index.html" aria-label="Voltar para o início">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </a>
      <h1>Produtos Cadastrados</h1>
    </header>

    <main class="conteudo-pagina">
      <div class="painel-pagina">
        <section class="bloco">
          <label class="busca-wrapper" for="buscaProduto">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.6-3.6" />
            </svg>
            <input
              type="search"
              id="buscaProduto"
              class="busca-produto"
              placeholder="Buscar produto..."
              autocomplete="off"
            />
          </label>

          <div id="listaProdutos"></div>

          <button class="btn-ver-mais" id="btnVerMais" type="button" hidden>
            Ver mais
          </button>
        </section>
      </div>
    </main>

    <div class="rodape">
      <div class="rodape-conteudo">
        <div class="rodape-acoes">
          <a class="btn-primario btn-primario-link" href="cadastrar-produto.html">
            Cadastrar Produto
          </a>
          <p class="rodape-divisor">ou</p>
          <a class="btn-voltar-rodape" href="index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" />
            </svg>
            <span>Voltar</span>
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="js/ver-produtos.js"></script>
  </body>
</html>
