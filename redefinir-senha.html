<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5c2e18" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="imagens/logo.png" />
    <link rel="apple-touch-icon" href="imagens/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Padaria Gestão" />
    <style>html{visibility:hidden}</style>
    <title>Nova senha - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login.css?v=20260925-1502" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <div class="login-hero">
        <div class="login-marca">
          <img src="imagens/logo.png" alt="Padaria Gestão" />
          <h1 id="tituloRedefinir">Nova senha</h1>
        </div>

        <section class="login-card" aria-labelledby="tituloRedefinir">
          <div class="login-form">
            <div class="login-campo">
              <label for="novaSenha">Nova senha</label>
              <div class="login-input-wrap">
                <svg class="login-input-icone" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input id="novaSenha" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" minlength="6" />
                <button id="btnAlternarSenha" class="login-senha-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                  <svg class="icone-olho-aberto" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                  <svg class="icone-olho-fechado" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 3 18 18" />
                    <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-2.2 2.9" />
                    <path d="M6.7 6.7C3.6 8.4 2 12 2 12s3.5 6 10 6a10.9 10.9 0 0 0 5.3-1.3" />
                    <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="login-campo">
              <label for="confirmarNovaSenha">Confirmar nova senha</label>
              <div class="login-input-wrap">
                <svg class="login-input-icone" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input id="confirmarNovaSenha" type="password" autocomplete="new-password" placeholder="Repita a senha" minlength="6" />
                <button id="btnAlternarConfirmarSenha" class="login-senha-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                  <svg class="icone-olho-aberto" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                  <svg class="icone-olho-fechado" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 3 18 18" />
                    <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-2.2 2.9" />
                    <path d="M6.7 6.7C3.6 8.4 2 12 2 12s3.5 6 10 6a10.9 10.9 0 0 0 5.3-1.3" />
                    <path d="M9.9 9.9A3 3 0 0 0 14.1 14.1" />
                  </svg>
                </button>
              </div>
            </div>

            <p id="avisoRedefinir" class="login-aviso" hidden></p>

            <button id="btnSalvar" class="login-primario" type="button">Salvar nova senha</button>
            <a id="btnVoltarLogin" class="login-secundario" href="login.html">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
              </svg>
              Voltar para o login
            </a>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="js/redefinir-senha.js"></script>
  </body>
</html>
