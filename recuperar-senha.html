<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5c2e18" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="imagens/logo.png" />
    <link rel="apple-touch-icon" href="imagens/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Padaria Gestão" />
    <style>html{visibility:hidden}</style>
    <title>Recuperar senha - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login.css?v=20260925-1502" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <div class="login-hero">
        <div class="login-marca">
          <img src="imagens/logo.png" alt="Padaria Gestão" />
          <h1 id="tituloRecuperar">Recuperar senha</h1>
          <p class="login-subtitulo">Vamos te ajudar a voltar</p>
        </div>

        <section class="login-card" aria-labelledby="tituloRecuperar">
          <div class="login-form">
            <div class="login-campo">
              <label for="emailRecuperar">E-mail</label>
              <div class="login-input-wrap">
                <svg class="login-input-icone" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m3 7 9 6 9-6" />
                </svg>
                <input id="emailRecuperar" type="email" autocomplete="email" placeholder="Digite seu e-mail" />
              </div>
            </div>

            <p id="avisoRecuperar" class="login-aviso" hidden></p>

            <button id="btnEnviar" class="login-primario" type="button">Enviar link de recuperação</button>
            <a id="btnVoltarLogin" class="login-secundario" href="login.html">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
              </svg>
              Voltar para o login
            </a>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="js/recuperar-senha.js"></script>
  </body>
</html>
