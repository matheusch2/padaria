<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#8c4527" />
    <title>Financeiro - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pagina.css" />
    <link rel="stylesheet" href="financeiro.css?v=20260925-1" />
    <link rel="stylesheet" href="financeiro-central-ajustes.css?v=20260925-1" />
  </head>
  <body class="pagina-app financeiro-body">
    <header class="topo-pagina">
      <a class="voltar" href="index.html" aria-label="Voltar para o início">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
      </a>
      <h1>Financeiro</h1>
    </header>

    <main class="conteudo-pagina financeiro-conteudo">
      <div class="painel-pagina financeiro-central">
        <section class="bloco financeiro-apresentacao">
          <div class="financeiro-icone-principal" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <h2>Controle financeiro</h2>
        </section>

        <section class="financeiro-menu" aria-label="Módulos financeiros">
          <a class="financeiro-menu-card principal" href="visao-financeira.html">
            <span class="financeiro-menu-icone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>
            </span>
            <span class="financeiro-menu-texto"><b>Visão financeira</b></span>
          </a>

          <button class="financeiro-menu-card" type="button" data-financeiro-pendente="Contas a pagar">
            <span class="financeiro-menu-icone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
            </span>
            <span class="financeiro-menu-texto"><b>Contas a pagar</b></span>
          </button>

          <button class="financeiro-menu-card" type="button" data-financeiro-pendente="Contas a receber">
            <span class="financeiro-menu-icone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4z"/><path d="M7 7V5h10v2"/><path d="M8 13h8"/></svg>
            </span>
            <span class="financeiro-menu-texto"><b>Contas a receber</b></span>
          </button>

          <button class="financeiro-menu-card" type="button" data-financeiro-pendente="Lançamentos">
            <span class="financeiro-menu-icone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="9"/></svg>
            </span>
            <span class="financeiro-menu-texto"><b>Receitas e despesas</b></span>
          </button>

          <button class="financeiro-menu-card" type="button" data-financeiro-pendente="Despesas recorrentes">
            <span class="financeiro-menu-icone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5.2 16A8 8 0 0 0 18 18.8M18.8 8A8 8 0 0 0 6 5.2"/></svg>
            </span>
            <span class="financeiro-menu-texto"><b>Despesas recorrentes</b></span>
          </button>

          <button class="financeiro-menu-card" type="button" data-financeiro-pendente="Fluxo de caixa">
            <span class="financeiro-menu-icone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 3 7-8"/><path d="M4 21h16"/></svg>
            </span>
            <span class="financeiro-menu-texto"><b>Fluxo de caixa</b></span>
          </button>

          <button class="financeiro-menu-card" type="button" data-financeiro-pendente="Relatórios financeiros">
            <span class="financeiro-menu-icone">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
            </span>
            <span class="financeiro-menu-texto"><b>Relatórios financeiros</b></span>
          </button>
        </section>

        <p id="avisoFinanceiro" class="financeiro-aviso" hidden></p>

        <a class="btn-voltar-rodape financeiro-voltar" href="index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          <span>Voltar</span>
        </a>
      </div>
    </main>

    <script type="module" src="js/financeiro.js?v=20260925-1"></script>
  </body>
</html>
