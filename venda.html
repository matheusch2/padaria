<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#8c4527" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="imagens/logo.png" />
    <link rel="apple-touch-icon" href="imagens/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Padaria Gestão" />
    <style>html{visibility:hidden}</style>
    <title>Lançar venda - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pagina.css" />
    <link rel="stylesheet" href="venda.css" />
  </head>

  <body class="pagina-app">
    <header class="topo-pagina">
      <a class="voltar" href="index.html" aria-label="Voltar para o início">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </a>
      <h1>Lançar Venda</h1>
    </header>

    <main class="conteudo-pagina">
      <div class="painel-pagina">
        <section class="bloco">
          <h2 class="bloco-titulo">Produtos</h2>

          <label class="busca-wrapper" for="buscaProduto">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.6-3.6" />
            </svg>
            <input
              type="search"
              id="buscaProduto"
              class="busca-produto"
              placeholder="Buscar produto..."
              autocomplete="off"
            />
          </label>

          <div class="lista-produtos" id="listaProdutos"></div>
        </section>

        <section class="bloco">
          <h2 class="bloco-titulo">Carrinho<span id="carrinhoContador" class="carrinho-contador" hidden></span></h2>
          <div id="carrinhoItens">
            <p class="carrinho-vazio">Nenhum item adicionado ainda.</p>
          </div>
        </section>

        <section class="bloco">
          <h2 class="bloco-titulo">Pagamento</h2>

          <div class="pagamento-split">
            <div class="pagamento-linha">
              <label for="valorDinheiro">Dinheiro</label>
              <div class="campo-valor">
                <span>R$</span>
                <input
                  type="text"
                  id="valorDinheiro"
                  inputmode="decimal"
                  placeholder="0,00"
                />
              </div>
            </div>

            <div class="pagamento-linha">
              <label for="valorCartao">Cartão</label>
              <div class="campo-valor">
                <span>R$</span>
                <input
                  type="text"
                  id="valorCartao"
                  inputmode="decimal"
                  placeholder="0,00"
                />
              </div>
            </div>

            <div class="pagamento-linha">
              <label for="valorPix">Pix</label>
              <div class="campo-valor">
                <span>R$</span>
                <input
                  type="text"
                  id="valorPix"
                  inputmode="decimal"
                  placeholder="0,00"
                />
              </div>
            </div>

            <div class="pagamento-resumo">
              <span>Total informado</span>
              <b id="totalInformado">R$ 0,00</b>
            </div>
            <p id="pagamentoDiferenca" class="pagamento-diferenca">
              <span id="pagamentoDiferencaTexto" class="pagamento-diferenca-vazio">Adicione produtos para calcular o restante.</span>
            </p>
          </div>
        </section>
      </div>
    </main>

    <div class="rodape">
      <div class="rodape-conteudo">
        <div class="bloco total-row">
          <div class="total-row-principal">
            <span class="total-row-icone">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2" y="6" width="20" height="12" rx="2" />
                <circle cx="12" cy="12" r="3" />
                <path d="M6 12h.01M18 12h.01" />
              </svg>
            </span>
            <div class="total-row-texto">
              <span>Total da venda</span>
              <small>Valor a receber</small>
            </div>
          </div>
          <b id="totalVenda">R$ 0,00</b>
        </div>
        <p id="avisoFinalizar" class="aviso-finalizar" hidden></p>
        <div class="rodape-acoes">
          <button class="btn-primario" id="btnFinalizar" type="button">
            Finalizar Venda
          </button>
        </div>
      </div>
    </div>

    <script src="js/numeros.js"></script>
    <script type="module" src="js/vendas/venda.js"></script>
  </body>
</html>
