<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#8c4527" />
    <title>Lançar venda - Padaria Gestão</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pagina.css" />
    <link rel="stylesheet" href="venda.css" />
  </head>

  <body class="pagina-app">
    <header class="topo-pagina">
      <a class="voltar" href="index.html" aria-label="Voltar para o início">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </a>
      <h1>Lançar Venda</h1>
    </header>

    <main class="conteudo-pagina">
      <div class="painel-pagina">
        <section class="bloco">
          <h2 class="bloco-titulo">Produtos</h2>

          <label class="busca-wrapper" for="buscaProduto">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.6-3.6" />
            </svg>
            <input
              type="search"
              id="buscaProduto"
              class="busca-produto"
              placeholder="Buscar produto..."
              autocomplete="off"
            />
          </label>

          <div class="lista-produtos" id="listaProdutos"></div>
        </section>

        <section class="bloco">
          <h2 class="bloco-titulo">Carrinho</h2>
          <div id="carrinhoItens">
            <p class="carrinho-vazio">Nenhum item adicionado ainda.</p>
          </div>
        </section>

        <section class="bloco">
          <h2 class="bloco-titulo">Pagamento</h2>

          <div class="pagamento-split">
            <div class="pagamento-linha">
              <label for="valorDinheiro">Dinheiro</label>
              <div class="campo-valor">
                <span>R$</span>
                <input
                  type="number"
                  id="valorDinheiro"
                  step="0.01"
                  min="0"
                  inputmode="decimal"
                  placeholder="0,00"
                />
              </div>
            </div>

            <div class="pagamento-linha">
              <label for="valorCartao">Cartão</label>
              <div class="campo-valor">
                <span>R$</span>
                <input
                  type="number"
                  id="valorCartao"
                  step="0.01"
                  min="0"
                  inputmode="decimal"
                  placeholder="0,00"
                />
              </div>
            </div>

            <div class="pagamento-linha">
              <label for="valorPix">Pix</label>
              <div class="campo-valor">
                <span>R$</span>
                <input
                  type="number"
                  id="valorPix"
                  step="0.01"
                  min="0"
                  inputmode="decimal"
                  placeholder="0,00"
                />
              </div>
            </div>

            <div class="pagamento-resumo">
              <span>Total informado</span>
              <b id="totalInformado">R$ 0,00</b>
            </div>
            <p id="pagamentoDiferenca" class="pagamento-diferenca">
              Adicione produtos para calcular o restante.
            </p>
          </div>
        </section>
      </div>
    </main>

    <div class="rodape">
      <div class="rodape-conteudo">
        <div class="bloco total-row">
          <div>
            <span>Total da venda</span>
            <small>Valor a receber</small>
          </div>
          <b id="totalVenda">R$ 0,00</b>
        </div>
        <p id="avisoFinalizar" class="aviso-finalizar" hidden></p>
        <div class="rodape-acoes">
          <button class="btn-primario" id="btnFinalizar" type="button">
            Finalizar Venda
          </button>
          <p class="rodape-divisor">ou</p>
          <a class="btn-voltar-rodape" href="index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" />
            </svg>
            <span>Voltar</span>
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="js/vendas/venda.js"></script>
  </body>
</html>
